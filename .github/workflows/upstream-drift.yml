name: Upstream Drift

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Test against guard-core@master
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.10.3@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout flaskapi-guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout guard-core@master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core
          ref: master
          path: guard-core-upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Stays on 3.12 on purpose: drift and live-stack smoke are interpreter-agnostic checks; the matrix in ci.yml runs the suite on every version.
          python-version: '3.12'

      - name: Install uv
        run: |
          pip install uv==0.13.4

      - name: Build the guard-core wheel from guard-core@master
        run: |
          cd guard-core-upstream
          uv build --wheel --out-dir ../wheels

      - name: Install the flaskapi-guard dev environment
        run: |
          uv sync --locked --extra dev

      - name: Force-install the guard-core@master wheel over the resolved one
        run: |
          wheel=$(find wheels -maxdepth 1 -name 'guard_core-*.whl' | head -n 1)
          uv pip install --python .venv/bin/python --no-deps --force-reinstall "$wheel"

      - name: Run the flaskapi-guard test suite against guard-core@master
        run: |
          IPINFO_TOKEN='test_token' REDIS_URL='redis://localhost:6379' REDIS_PREFIX='drift:flaskapi_guard:' uv run python -m pytest -v --cov=flaskapi_guard
