name: Live Smoke

on:
  push:
    branches:
      - master
    paths:
      - 'flaskapi_guard/**'
      - 'examples/**'
      - '.github/workflows/live-smoke.yml'
  pull_request:
    paths:
      - 'flaskapi_guard/**'
      - 'examples/**'
      - '.github/workflows/live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read # check out the repository

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    name: Dockerized smoke run (simple_app)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_SMOKE_PROJECT: flaskapi-guard-live-smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Stays on 3.12 on purpose: drift and live-stack smoke are interpreter-agnostic checks; the matrix in ci.yml runs the suite on every version.
          python-version: '3.12'

      - name: Install uv
        run: |
          pip install uv==0.13.4

      - name: Build the flaskapi_guard wheel from this checkout
        run: |
          uv build --wheel --out-dir examples/live_smoke_wheels

      - name: Stage the example app with the checkout wheel
        run: |
          rm -rf live_smoke_stack
          cp -r examples/simple_app live_smoke_stack
          wheel=$(find examples/live_smoke_wheels -maxdepth 1 -name 'flaskapi_guard-*.whl' | head -n 1)
          cp "$wheel" live_smoke_stack/
          python3 - <<'EOF'
          import pathlib
          stack = pathlib.Path("live_smoke_stack")
          wheel = next(stack.glob("flaskapi_guard-*.whl"))
          req = stack / "requirements.txt"
          lines = [line for line in req.read_text().splitlines() if not line.startswith("flaskapi_guard")]
          lines.append(f"flaskapi_guard @ file:///app/{wheel.name}")
          req.write_text("\n".join(lines) + "\n")
          dockerfile = stack / "Dockerfile"
          df = dockerfile.read_text()
          anchor = "COPY requirements.txt /app/"
          assert anchor in df
          dockerfile.write_text(df.replace(anchor, anchor + f"\nCOPY {wheel.name} /app/"))
          EOF

      - name: Bring the smoke stack up
        run: |
          docker compose -p "$LIVE_SMOKE_PROJECT" -f live_smoke_stack/docker-compose.yml up --build -d --wait

      - name: Run smoke assertions
        run: |
          set -euo pipefail
          base="http://localhost:8000"

          # Wait for the app to finish initializing (engine redis + ipinfo setup)
          ready=""
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 "$base/")" = "200" ]; then
              ready=1; break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "FAIL: app never became ready"; exit 1
          fi

          check() {
            local name="$1" expected="$2"; shift 2
            local status
            status=$(curl -sS --max-time 10 -o /tmp/smoke_body -w '%{http_code}' "$@") || {
              echo "FAIL: $name (curl error)"; exit 1
            }
            if [ "$status" != "$expected" ]; then
              echo "FAIL: $name (expected $expected, got $status)"; cat /tmp/smoke_body; exit 1
            fi
            echo "ok: $name -> $status"
          }

          check "GET / serves" 200 "$base/"
          check "GET /health serves" 200 "$base/health"

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -p "$LIVE_SMOKE_PROJECT" -f live_smoke_stack/docker-compose.yml logs --no-color

      - name: Bring the smoke stack down
        if: always()
        run: |
          docker compose -p "$LIVE_SMOKE_PROJECT" -f live_smoke_stack/docker-compose.yml down -v --remove-orphans
